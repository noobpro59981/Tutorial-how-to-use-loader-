<!DOCTYPE html>
<html>
<head>
    <title>Key Manager</title>
    <script>
        // I-save ang lahat ng data sa localStorage
        let keyList = JSON.parse(localStorage.getItem('keyList')) || [];

        // I-update ang display ng lahat ng key
        function updateDisplay() {
            let table = document.getElementById('keyTable');
            table.innerHTML = '';
            
            // Header ng table
            let headerRow = table.insertRow();
            headerRow.innerHTML = `<th>Key</th><th>Valid Until</th><th>Status</th><th>Action</th>`;

            // Ipakita ang lahat ng key
            keyList.forEach((item, index) => {
                let row = table.insertRow();
                row.innerHTML = `
                    <td>${item.key}</td>
                    <td>${item.validUntil}</td>
                    <td>${item.blocked ? '🔴 BLOCKED' : '🟢 ACTIVE'}</td>
                    <td>
                        <button onclick="${item.blocked ? 'unblockKey(' + index + ')' : 'blockKey(' + index + ')'}" 
                                style="background:${item.blocked ? '#4CAF50' : '#f44336'};color:white;">
                            ${item.blocked ? 'UNBLOCK' : 'BLOCK'}
                        </button>
                    </td>
                `;
            });

            // I-update ang latest generated key display
            let latestKey = keyList[keyList.length - 1];
            document.getElementById('generatedKey').textContent = latestKey ? latestKey.key : 'Wala pa pong key na nabuo';
            document.getElementById('validUntil').textContent = latestKey ? latestKey.validUntil : 'Wala pa';
        }

        // Generate bagong key (pwede i-adjust ang days/hours/minutes)
        function generateKey() {
            const prefix = document.getElementById('prefix').value || 'APP-';
            const type = document.querySelector('input[name="validityType"]:checked').value;
            const length = parseInt(document.getElementById('length').value) || 1;

            // Gumawa ng random key
            const random = Math.floor(Math.random() * 900000) + 100000;
            const key = prefix + random;

            // Kalkulahin ang expiration (pwede i-adjust ang days)
            let expires = new Date();
            if (type === 'Days') expires.setDate(expires.getDate() + length);
            if (type === 'Hours') expires.setHours(expires.getHours() + length);
            if (type === 'Minutes') expires.setMinutes(expires.getMinutes() + length);
            const validUntil = expires.toISOString().slice(0, 19).replace('T', ' ');

            // I-save ang key na may status na ACTIVE
            keyList.push({ key, validUntil, blocked: false });
            localStorage.setItem('keyList', JSON.stringify(keyList));
            updateDisplay();
        }

        // Block key
        function blockKey(index) {
            keyList[index].blocked = true;
            localStorage.setItem('keyList', JSON.stringify(keyList));
            updateDisplay();
        }

        // Unblock key
        function unblockKey(index) {
            keyList[index].blocked = false;
            localStorage.setItem('keyList', JSON.stringify(keyList));
            updateDisplay();
        }

        // Ipakita ang data kapag buksan ang page
        window.onload = updateDisplay;
    </script>
</head>
<body>
    <h2>Generate Key</h2>
    <div>
        Key Prefix: <input type="text" id="prefix" placeholder="Hal: APP-, PROD-">
    </div>
    <div>
        Set Validity Type:<br>
        <input type="radio" name="validityType" value="Days" checked> Days<br>
        <input type="radio" name="validityType" value="Hours"> Hours<br>
        <input type="radio" name="validityType" value="Minutes"> Minutes
    </div>
    <div>
        Validity Length: <input type="number" id="length" min="1" value="1"> 
        <small>(Pwede mong i-adjust ang bilang dito)</small>
    </div>
    <button onclick="generateKey()">Generate New Key</button>

    <h3>Latest Generated Key:</h3>
    <p>- <span id="generatedKey">Wala pa pong key na nabuo</span> -</p>
    <h3>Valid Until:</h3>
    <p>- <span id="validUntil">Wala pa</span> -</p>

    <h3>All Keys (Block/Unblock Here):</h3>
    <table id="keyTable" border="1" cellpadding="8" cellspacing="0"></table>

    <!-- Para ma-access ng loader ang lahat ng data -->
    <div id="allKeyData" style="display:none;">${JSON.stringify(keyList)}</div>
</body>
</html>
