<!DOCTYPE html>
<html>
<head>
    <title>Vince Injector Online Panel</title>
    <script>
        // ONLINE KEY STORAGE (MA-BABASA NG INJECTOR)
        let keyDatabase = [
            { 
                "key": "vincepogi", 
                "validUntil": "2026-03-20 18:00:00", 
                "blocked": false, 
                "maxDevices": 3, 
                "usedDevices": 0 
            },
            { 
                "key": "vincefree", 
                "validUntil": "2026-03-15 12:00:00", 
                "blocked": false, 
                "maxDevices": 2, 
                "usedDevices": 0 
            },
            { 
                "key": "vinceeee", 
                "validUntil": "2026-04-20 18:30:00", 
                "blocked": false, 
                "maxDevices": 1, 
                "usedDevices": 0 
            }
        ];

        // I-SAVE ANG DATABASE SA PAGE PARA MABASA NG INJECTOR
        function updateKeyData() {
            document.getElementById('onlineKeyData').textContent = JSON.stringify(keyDatabase);
            updateDisplay();
        }

        // GENERATE BAGONG KEY
        function generateNewKey() {
            const prefix = document.getElementById('prefixInput').value || 'VINCE-';
            const type = document.querySelector('input[name="validityType"]:checked').value;
            const length = parseInt(document.getElementById('lengthInput').value) || 30;

            const random = Math.floor(Math.random() * 900000) + 100000;
            const newKey = prefix + random;

            let expires = new Date();
            if (type === 'Days') expires.setDate(expires.getDate() + length);
            if (type === 'Hours') expires.setHours(expires.getHours() + length);
            if (type === 'Minutes') expires.setMinutes(expires.getMinutes() + length);
            const validUntil = expires.toISOString().slice(0, 19).replace('T', ' ');

            keyDatabase.push({
                "key": newKey,
                "validUntil": validUntil,
                "blocked": false,
                "maxDevices": parseInt(document.getElementById('devLimitInput').value) || 1,
                "usedDevices": 0
            });

            updateKeyData();
            alert("Key Generated: " + newKey);
        }

        // BLOCK/UNBLOCK KEY
        function toggleBlock(keyToToggle) {
            for (let i = 0; i < keyDatabase.length; i++) {
                if (keyDatabase[i].key === keyToToggle) {
                    keyDatabase[i].blocked = !keyDatabase[i].blocked;
                    break;
                }
            }
            updateKeyData();
        }

        // UPDATE DEVICE COUNT
        function updateDeviceCount(keyToUpdate) {
            for (let i = 0; i < keyDatabase.length; i++) {
                if (keyDatabase[i].key === keyToUpdate && keyDatabase[i].usedDevices < keyDatabase[i].maxDevices) {
                    keyDatabase[i].usedDevices += 1;
                    break;
                }
            }
            updateKeyData();
        }

        // I-PAKITA ANG MGA KEY SA TABLE
        function updateDisplay() {
            let table = document.getElementById('keyTable');
            table.innerHTML = '';
            let header = table.insertRow();
            header.innerHTML = `
                <th>KEY</th>
                <th>VALID UNTIL</th>
                <th>DEVICE LIMIT</th>
                <th>USED DEVICES</th>
                <th>STATUS</th>
                <th>ACTION</th>
            `;

            keyDatabase.forEach(item => {
                let row = table.insertRow();
                row.innerHTML = `
                    <td>${item.key}</td>
                    <td>${item.validUntil}</td>
                    <td>${item.maxDevices}</td>
                    <td>${item.usedDevices}</td>
                    <td>${item.blocked ? '🔴 BLOCKED' : '🟢 ACTIVE'}</td>
                    <td>
                        <button onclick="toggleBlock('${item.key}')" style="background:${item.blocked ? '#4CAF50' : '#f44336'};color:white;">
                            ${item.blocked ? 'UNBLOCK' : 'BLOCK'}
                        </button>
                    </td>
                `;
            });

            // I-PAKITA ANG LATEST KEY
            let latest = keyDatabase[keyDatabase.length - 1];
            document.getElementById('generatedKey').textContent = latest.key;
            document.getElementById('validUntil').textContent = latest.validUntil;
        }

        // I-LOAD LAHAT KAPAG BUKAS ANG PAGE
        window.onload = function() {
            updateKeyData();
        };
    </script>
</head>
<body style="background:#1a1a1a;color:white;padding:20px;font-family:Arial;">
    <h1>🔐 VINCE INJECTOR ONLINE PANEL</h1>

    <!-- KEY GENERATOR SECTION -->
    <h3>✨ Generate New Key:</h3>
    <div>Key Prefix: <input type="text" id="prefixInput" placeholder="Hal: VINCE-NEW-"></div>
    <div>
        Set Validity Type:<br>
        <input type="radio" name="validityType" value="Days" checked> Days<br>
        <input type="radio" name="validityType" value="Hours"> Hours<br>
        <input type="radio" name="validityType" value="Minutes"> Minutes
    </div>
    <div>Validity Length: <input type="number" id="lengthInput" min="1" value="30"></div>
    <div>Max Devices Allowed: <input type="number" id="devLimitInput" min="1" value="1"></div>
    <button onclick="generateNewKey()" style="margin:10px 0;padding:8px;">Generate New Key</button>

    <!-- LATEST KEY DISPLAY -->
    <hr>
    <h3>📌 Latest Generated Key:</h3>
    <p>Generated Key: <strong>- <span id="generatedKey">Wala pa pong key na nabuo</span> -</strong></p>
    <p>Valid Until: <strong>- <span id="validUntil">Wala pa</span> -</strong></p>

    <!-- ALL KEYS TABLE -->
    <hr>
    <h3>📋 ALL ONLINE KEYS:</h3>
    <table id="keyTable" border="1" cellpadding="8" cellspacing="0" width="100%"></table>

    <!-- IMPORTANTE: INJECTOR MAGBABASA DITO -->
    <div id="onlineKeyData" style="display:none;"></div>
</body>
</html>
