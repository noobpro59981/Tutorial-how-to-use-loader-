<!DOCTYPE html>
<html>
<head>
    <title>ALP KEY CONTROL PANEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff9d;
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #00ff9d;
        }
        .section-title {
            color: #00ccff;
            margin-bottom: 15px;
            font-size: 18px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #00ff9d;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #00ff9d;
            border-radius: 5px;
        }
        .btn {
            background: #00ccff;
            color: #1a1a1a;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-delete { background: #ff4444; color: #fff; }
        .key-list {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #00ff9d;
            border-radius: 5px;
        }
        .key-item {
            padding: 8px;
            margin: 5px 0;
            background: #2d2d2d;
            border-radius: 3px;
        }
        .status-active { color: #00ff9d; }
        .status-inactive { color: #ff4444; }
        #databaseDisplay {
            display: none; /* HIDDEN FOR INJECTOR TO READ */
        }
    </style>
</head>
<body>
    <h1>🔐 ALP ONLINE KEY DATABASE</h1>

    <!-- KEY GENERATOR SECTION -->
    <div class="section">
        <div class="section-title">✨ GENERATE NEW KEY</div>
        <label for="keyName">Key Name (Hal: vincepogi, ALP-VIP)</label>
        <input type="text" id="keyName" placeholder="Isulat ang eksaktong pangalan ng key">

        <label for="maxDevices">Max Devices Allowed</label>
        <input type="number" id="maxDevices" min="1" value="3">

        <label for="validDays">Validity (Days)</label>
        <input type="number" id="validDays" min="1" value="30">

        <button class="btn" onclick="generateKey()">GENERATE KEY</button>
    </div>

    <!-- KEY DATABASE DISPLAY -->
    <div class="section">
        <div class="section-title">📋 ONLINE KEY DATABASE</div>
        <div class="key-list" id="keyList">
            <!-- DEFAULT KEY: vincepogi -->
            <div class="key-item">
                <strong>Key:</strong> vincepogi | 
                <strong>Max Devices:</strong> 3 | 
                <strong>Valid Until:</strong> 2026-12-31 23:59:00 | 
                <strong>Status:</strong> <span class="status-active">ACTIVE</span>
                <button class="btn btn-delete" onclick="deleteKey('vincepogi')">DELETE</button>
            </div>
        </div>
    </div>

    <!-- HIDDEN DATABASE FOR INJECTOR -->
    <div id="databaseDisplay">
        [
            {
                "key": "vincepogi",
                "validUntil": "2026-12-31 23:59:00",
                "maxDevices": 3,
                "usedDevices": 0,
                "active": true
            }
        ]
    </div>

    <script>
        // LOAD DATABASE FROM HIDDEN DIV
        let keyDatabase = JSON.parse(document.getElementById('databaseDisplay').textContent);

        // UPDATE DISPLAY & DATABASE
        function updateDatabase() {
            // UPDATE KEY LIST UI
            let keyList = document.getElementById('keyList');
            keyList.innerHTML = "";
            keyDatabase.forEach(key => {
                let item = document.createElement('div');
                item.className = "key-item";
                item.innerHTML = `
                    <strong>Key:</strong> ${key.key} | 
                    <strong>Max Devices:</strong> ${key.maxDevices} | 
                    <strong>Valid Until:</strong> ${key.validUntil} | 
                    <strong>Status:</strong> <span class="${key.active ? 'status-active' : 'status-inactive'}">${key.active ? 'ACTIVE' : 'INACTIVE'}</span>
                    <button class="btn btn-delete" onclick="deleteKey('${key.key}')">DELETE</button>
                `;
                keyList.appendChild(item);
            });

            // UPDATE HIDDEN DATABASE
            document.getElementById('databaseDisplay').textContent = JSON.stringify(keyDatabase);
        }

        // GENERATE NEW KEY
        function generateKey() {
            let keyName = document.getElementById('keyName').value.trim();
            let maxDevices = parseInt(document.getElementById('maxDevices').value) || 1;
            let validDays = parseInt(document.getElementById('validDays').value) || 30;

            if (!keyName) {
                alert("Isulat muna ang pangalan ng key!");
                return;
            }

            // CHECK IF KEY ALREADY EXISTS
            let existingKey = keyDatabase.find(k => k.key === keyName);
            if (existingKey) {
                alert("Key na ito ay mayroon na sa database!");
                return;
            }

            // CALCULATE VALID UNTIL
            let validUntil = new Date();
            validUntil.setDate(validUntil.getDate() + validDays);
            validUntil = validUntil.toISOString().slice(0, 19).replace('T', ' ');

            // ADD TO DATABASE
            keyDatabase.push({
                key: keyName,
                validUntil: validUntil,
                maxDevices: maxDevices,
                usedDevices: 0,
                active: true
            });

            updateDatabase();
            alert("Key na '" + keyName + "' ay naidagdag sa database!");
            document.getElementById('keyName').value = "";
        }

        // DELETE KEY
        function deleteKey(keyToDelete) {
            if (!confirm("Sigurado ka bang gusto mong tanggalin ang key na '" + keyToDelete + "'?")) return;
            keyDatabase = keyDatabase.filter(k => k.key !== keyToDelete);
            updateDatabase();
            alert("Key na '" + keyToDelete + "' ay naalis sa database!");
        }
    </script>
</body>
</html>
